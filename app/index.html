.page-actions>.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.footer-hidden .statusbar{display:none}
.footer-hidden:not(.reader-focus)>.workspace{grid-template-rows:64px minmax(0,1fr)}
.source-entry-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.source-entry-heading h3{min-width:0;font-weight:500}
.source-entry-links{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
@media(max-width:700px){.page-actions{justify-content:flex-start}.source-entry-heading{align-items:flex-start;flex-wrap:wrap}}
.comparison-delta{display:block;color:var(--text)}.comparison-notices{flex-shrink:0;font-size:12px;margin:0 0 14px}.comparison-notices summary,.comparison-conditions summary{cursor:pointer}.comparison-notices ul,.comparison-conditions ul{margin:8px 0;padding-left:20px}.comparison-notices li+li,.comparison-conditions li+li{margin-top:5px}.comparison-conditions{font-size:12px;padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--line)}.comparison-conditions details{margin-top:12px}.comparison-periods{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:12px}.comparison-periods>div{min-width:0;overflow-wrap:anywhere}.comparison-periods pre{white-space:pre-wrap;overflow-wrap:anywhere}.comparison-conditions .comparison-evidence pre{max-height:160px;overflow:auto}.comparison-source>.source-location{margin-top:12px}@media(max-width:600px){.comparison-periods{grid-template-columns:1fr;gap:14px}}
