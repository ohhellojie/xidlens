@media(min-width:1200px) and (max-width:1400px){#gpu-polished-app .g-topo-groups{gap:16px}#gpu-polished-app .g-topo-main{padding:18px}#gpu-polished-app .g-tree-rows{margin-left:5px;padding-left:10px}#gpu-polished-app .g-tree-row:before{left:-11px;width:11px}}
@media(max-width:1199px){#gpu-polished-app .g-topo-content{grid-template-columns:1fr}#gpu-polished-app .g-topo-inspector{border-left:0;border-top:1px solid var(--g-line)}#gpu-polished-app .g-inspector-fields{grid-template-columns:repeat(3,minmax(0,1fr))}#gpu-polished-app .g-path-steps{display:flex;flex-wrap:wrap;gap:22px}#gpu-polished-app .g-path-steps>div{min-width:140px}}
@media(max-width:740px){#gpu-polished-app .g-file-label{order:3;flex-basis:100%;border-left:0;padding:0;text-align:left}#gpu-polished-app .g-header-actions{margin-left:auto}#gpu-polished-app .g-topo-groups{grid-template-columns:1fr}#gpu-polished-app .g-inspector-fields{grid-template-columns:repeat(2,minmax(0,1fr))}#gpu-polished-app .g-topo-toolbar{align-items:flex-start}}
@media(max-width:540px){#gpu-polished-app .g-titlebar{padding:14px 16px;gap:10px}#gpu-polished-app .g-brand{font-size:14px;margin-right:90px}#gpu-polished-app .g-header-actions{margin-left:0}#gpu-polished-app .g-file-label{order:2}#gpu-polished-app .g-tabs{gap:20px;padding:0 16px}#gpu-polished-app .g-pageintro{padding:20px 16px 14px}#gpu-polished-app .g-section,#gpu-polished-app .g-list,#gpu-polished-app .g-detail,#gpu-polished-app .g-topo-shell{margin-left:12px;margin-right:12px}#gpu-polished-app .g-section,#gpu-polished-app .g-detail{padding:16px}#gpu-polished-app .g-fields{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px}#gpu-polished-app .g-fields .g-field:first-child{grid-column:1/-1}#gpu-polished-app .g-topo-main{padding:16px 12px}#gpu-polished-app .g-node{padding:8px}#gpu-polished-app .g-tree-rows{margin-left:4px;padding-left:10px}#gpu-polished-app .g-tree-row:before{left:-11px;width:11px}#gpu-polished-app .g-tree-row{grid-template-columns:minmax(0,1fr) 12px minmax(0,1fr)}#gpu-polished-app .g-inspector-fields{grid-template-columns:1fr}#gpu-polished-app .g-inspector-fields>div{grid-template-columns:84px minmax(0,1fr)}#gpu-polished-app .g-path-steps{display:grid}#gpu-polished-app .g-search input{min-width:130px}#gpu-polished-app .g-list>.g-heading{padding:14px}#gpu-polished-app .g-toast{right:12px;max-width:calc(100% - 24px)}}
@media(prefers-reduced-motion:reduce){#gpu-polished-app *,#gpu-polished-app *:before,#gpu-polished-app *:after{animation:none!important;transition:none!important}}
</style>
<div class="g-window">
  <header class="g-titlebar"><div class="g-brand"><span class="g-mark" aria-hidden="true">X</span>XidLens</div><select id="gl-case-select" aria-label="选择日志" class="g-file-label"><option>尚未导入</option></select><div class="g-header-actions"><button type="button" data-action="import" class="cursor-interaction">导入日志</button><button type="button" data-action="export" class="cursor-interaction">导出</button><button type="button" data-action="quit" class="g-link cursor-interaction">退出</button></div></header>
  <div id="gl-notice" style="padding:10px 24px" hidden></div><div class="g-tabs" role="tablist" aria-label="分析页面">
    <button type="button" role="tab" id="gl-tab-device" aria-controls="gl-device" aria-selected="true" data-page="device" class="cursor-interaction">设备信息</button>
    <button type="button" role="tab" id="gl-tab-errors" aria-controls="gl-errors" aria-selected="false" data-page="errors" class="cursor-interaction">错误记录 <span class="g-muted">0</span></button>
    <button type="button" role="tab" id="gl-tab-topology" aria-controls="gl-topology" aria-selected="false" data-page="topology" class="cursor-interaction">PCIe 拓扑</button>
  </div>
  <section id="gl-device" role="tabpanel" aria-labelledby="gl-tab-device">
    <div class="g-pageintro"><div><h1>设备信息</h1><p>尚未导入</p></div></div>
    <div class="g-section">
      <div class="g-heading"><h2>服务器信息</h2><button type="button" data-action="copy-server" class="cursor-interaction">复制服务器信息</button></div>
      <div class="g-fields" id="gl-server-fields">
</div>
    </div>
    <div class="g-list">
      <div class="g-heading">
        <h2>GPU 列表 <span id="gl-gpu-count" class="g-muted">8</span></h2>
        <div class="g-actions">
          <div class="g-search"><input type="search" id="gl-search" aria-label="搜索 SN 或 PCI 地址" placeholder="搜索 SN / PCI 地址" autocomplete="off"><button type="button" id="gl-clear-search" data-action="clear-search" class="g-link cursor-interaction" hidden>清除</button></div>
          <button type="button" id="gl-copy-excel" data-action="copy-excel" class="cursor-interaction">复制到 Excel</button>
        </div>
      </div>
      <div class="g-tablewrap"><table aria-label="GPU 列表"><thead><tr><th>GPU</th><th>型号</th><th>PCI 地址</th><th>SN</th><th>读取状态</th><th>错误记录</th></tr></thead><tbody id="gl-gpu-body"></tbody></table></div>
    </div>
    <div id="gl-gpu-detail" class="g-detail" aria-live="polite"></div>
  </section>
  <section id="gl-errors" role="tabpanel" aria-labelledby="gl-tab-errors" hidden>
    <div class="g-pageintro"><div><h1>错误记录</h1><p>尚未导入</p></div></div>
    <div class="g-list">
      <div class="g-heading"><h2>错误记录 <span id="gl-error-count" class="g-muted">2</span></h2><label class="g-filter" for="gl-error-filter">设备 <select id="gl-error-filter"><option value="all">全部记录</option></select></label></div>
      <div class="g-tablewrap"><table class="g-error-table" aria-label="错误记录"><thead><tr><th>时间</th><th>设备</th><th>代码</th><th>说明</th></tr></thead><tbody id="gl-error-body"></tbody></table></div>
    </div>
    <div id="gl-error-pager" class="g-actions" style="margin:0 24px 16px"></div><div id="gl-error-detail" class="g-detail" aria-live="polite"></div>
  </section>
  <section id="gl-topology" role="tabpanel" aria-labelledby="gl-tab-topology" hidden>
    <div class="g-pageintro"><div><h1>PCIe 拓扑</h1><p>尚未导入</p></div><button type="button" data-action="topology-source" class="cursor-interaction">原始拓扑</button></div>
    <div class="g-topo-shell">
      <div class="g-topo-toolbar"><div class="g-segment" aria-label="拓扑视图"><button type="button" data-topology-view="graph" aria-pressed="true" class="cursor-interaction">连接图</button><button type="button" data-topology-view="list" aria-pressed="false" class="cursor-interaction">路径列表</button></div><label class="g-filtercheck"><input type="checkbox" id="gl-topology-only-errors">仅看有错误记录的 GPU</label></div>
      <div class="g-topo-content"><div class="g-topo-main"><div id="gl-topology-graph" class="g-topo-groups" aria-label="PCIe 连接图"></div><div id="gl-topology-paths" class="g-tablewrap" hidden></div><div class="g-topo-help"><span><span class="g-legend-line"></span>选中路径</span><span><span class="g-record-dot" aria-hidden="true"></span> 有错误记录</span></div></div><aside id="gl-topology-inspector" class="g-topo-inspector" aria-live="polite" aria-label="拓扑节点详情"></aside></div>
    </div>
  </section>
  <div class="g-status"><span id="gl-status" role="status" aria-live="polite">已完成</span><span>v0.1.0 · 离线</span></div>
</div>
<div id="gl-toast" class="g-toast" hidden aria-hidden="true"></div>
<div id="gl-overlay" class="g-overlay" hidden><section id="gl-dialog" class="g-dialog" role="dialog" aria-modal="true" aria-labelledby="gl-dialog-title"><div class="g-dialog-head"><h2 id="gl-dialog-title"></h2><button type="button" data-action="close-dialog" aria-label="关闭" class="cursor-interaction">关闭</button></div><div id="gl-dialog-body"></div></section></div>
<script src="/app.js"></script>
</div>

</main></body></html>
