<body>
<div class="shell" id="app">
 <aside class="sidebar" aria-label="主导航">
  <div class="brand"><span class="brand-mark" id="brand-mark" aria-hidden="true"><img src="/logo.png" alt=""></span><span class="brand-text">XidLens</span></div>
  <div class="nav-caption">日志分析</div>
  <nav id="navigation"></nav>
  <div class="sidebar-foot"><a class="manual-link" href="https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html" target="_blank" rel="noopener noreferrer" aria-label="打开 NVIDIA 官方手册" id="manual"></a><div class="prototype-tag">v0.2.0</div></div>
 </aside>
 <div class="workspace">
  <header class="topbar">
   <div class="file-context"><div class="file-icon" id="file-icon" aria-hidden="true"></div><div class="file-meta"><strong id="filename">尚未导入日志</strong><button type="button" class="file-status" id="file-description" disabled></button></div><label class="sr-only" for="log-select">切换日志</label><div class="log-switch" id="log-switch" title="切换日志"><select class="log-select" id="log-select"><option value="">尚未导入</option></select></div></div>

  </header>
  <main class="content" id="content"></main>
  <footer class="statusbar"><span id="status" role="status"></span><span>日志在本机处理</span></footer>
 </div>

 <div class="menu" id="export-menu" role="menu" aria-label="导出格式" hidden></div>
 <dialog class="dialog" id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="btn quiet icon-btn" data-action="close-dialog" aria-label="关闭弹窗" id="dialog-close"></button></div><div class="dialog-body" id="dialog-body"></div><div class="dialog-foot" id="dialog-foot"></div></dialog>
